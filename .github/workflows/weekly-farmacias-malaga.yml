name: Weekly Update Malaga Farmacias

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  update-farmacias:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install curl_cffi beautifulsoup4 pdfminer.six

      - name: Run weekly Málaga pharmacy directory sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/update_malaga_farmacias.py
